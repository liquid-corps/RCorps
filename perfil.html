<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Perfil - RCorps</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@400;700&display=swap');
  @font-face{
    font-family:'Pixel Arial 11';
    src:url('PixelArial11.ttf') format('truetype');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }
  :root{
    --page-bg:#f1eee4;
    --card-bg:#f4f3ee;
    --card-border:#3b322b;
    --field-bg:#f5f4ef;
    --field-border:#4a4238;
    --text-dark:#2b2216;
    --text-muted:#8d8272;
    --admin-color:#5a1414;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--page-bg);
    font-family:'Pixel Arial 11', monospace;
    color:var(--text-dark);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 12px 80px;
  }

  /* ============ TOP NAV ============ */
  .hotbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    min-height:70px;
    padding:12px 30px;
    margin-bottom:24px;
    background-image:url('assets/hotbar.png');
    background-size:100% 100%;
    background-repeat:no-repeat;
    flex-wrap:wrap;
    gap:10px;
  }
  .hotbar-nav{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
  }
  .hotbar-nav a{color:var(--text-dark);text-decoration:none;}
  .hotbar-nav a:hover{opacity:0.75;}
  .hotbar-nav .sep{color:var(--text-muted);}
  .hotbar-nav .active{font-weight:bold;text-decoration:underline;text-decoration-style:dotted;}

  /* Badge de ADMIN en la barra */
  .admin-badge{
    background:var(--admin-color);
    color:#fff;
    font-size:10px;
    padding:3px 8px;
    border-radius:3px;
    font-weight:bold;
    letter-spacing:0.5px;
  }

  /* ============ LOGIN VIEW ============ */
  .login-view{
    width:100%;
    max-width:450px;
    background:#f5f0e6;
    border:1.5px solid #a3967d;
    border-radius:6px;
    padding:30px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    box-shadow:0 6px 12px rgba(0,0,0,0.05);
    margin:40px auto;
  }
  .login-view h1{
    margin:0;
    color:#4e3629;
    font-size:28px;
    font-family:'Courier New',monospace;
    font-weight:bold;
  }
  .login-view p{
    margin:0;
    color:#555;
    max-width:320px;
    line-height:1.5;
    font-size:13px;
  }
  .login-view .discord-btn{
    background:#5865F2;
    color:#f5f0e6;
    border:2px solid #404eed;
    border-radius:4px;
    padding:10px 24px;
    font-weight:bold;
    font-size:0.95em;
    text-transform:uppercase;
    letter-spacing:1px;
    cursor:pointer;
    box-shadow:3px 3px 0px #000;
    transition:all 0.1s ease;
    margin:15px 0;
    font-family:inherit;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .login-view .discord-btn:hover{
    background:#4752c4;
    box-shadow:1px 1px 0px #000;
    transform:translate(2px,2px);
  }
  .login-view .discord-btn:active{
    transform:translate(3px,3px);
    box-shadow:none;
  }

  /* ============================================================
     CANVAS DE TARJETA RPG (TAMAÑO NATIVO 956x579 DE LOS PNG)
     ============================================================ */
  .rpg-card-canvas,
  .rpg-card-canvas * {
    box-sizing: border-box !important;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
    outline: none !important;
    background-color: transparent !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    appearance: none !important;
    -webkit-appearance: none !important;
  }

  /* ============================================================
     CONTENEDOR Y ESCALADOR DE TARJETA RPG
     ============================================================ */
  .rpg-canvas-wrapper {
    width: 956px;
    max-width: 100vw !important;
    margin: 0 auto;
    position: relative;
    box-sizing: border-box;
  }
  .rpg-canvas-scaler {
    width: 956px !important;
    height: 579px !important;
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: 0 0;
  }
  .rpg-card-canvas {
    width: 956px !important;
    height: 579px !important;
    min-width: 956px !important;
    min-height: 579px !important;
    background-image: url('card/base.png') !important;
    background-size: 100% 100% !important;
    background-repeat: no-repeat !important;
    position: relative !important;
    display: grid !important;
    grid-template-columns: 330px 480px !important;
    gap: 24px !important;
    padding: 46px 44px 36px 44px !important;
    font-family: 'Pixel Arial 11', monospace !important;
    color: #2b2216 !important;
    overflow: visible !important;
    margin: 0 !important;
  }

  .rpg-card-canvas .canvas-left {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    position: relative !important;
  }

  .rpg-card-canvas .canvas-photo-wrap {
    position: relative !important;
    width: 270px !important;
    height: 260px !important;
    background-image: url('card/foto_perfil.png') !important;
    background-size: 100% 100% !important;
    background-repeat: no-repeat !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    margin-top: 20px !important;
    margin-bottom: 30px !important;
  }
  .rpg-card-canvas .canvas-photo-wrap.editable { cursor: pointer !important; }

  .rpg-card-canvas .canvas-photo-wrap img.portrait-img {
    width: 82% !important;
    height: 82% !important;
    max-width: 222px !important;
    max-height: 214px !important;
    object-fit: cover !important;
    border-radius: 6px !important;
    display: none;
  }
  .rpg-card-canvas .canvas-photo-wrap.has-img img.portrait-img { display: block !important; }

  .rpg-card-canvas .canvas-clan-icon {
    position: absolute !important;
    top: -30px !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    width: 76px !important;
    height: 72px !important;
    background-image: url('card/clan_icon.png') !important;
    background-size: 100% 100% !important;
    background-repeat: no-repeat !important;
    z-index: 40 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }

  .rpg-card-canvas .canvas-clan-icon img {
    width: 68% !important;
    height: 68% !important;
    max-width: 52px !important;
    max-height: 48px !important;
    object-fit: contain !important;
  }

  .rpg-card-canvas .canvas-tag-badge {
    position: absolute !important;
    bottom: -18px !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    width: 72% !important;
    height: 38px !important;
    object-fit: contain !important;
    z-index: 40 !important;
    pointer-events: none !important;
    display: none;
  }
  .rpg-card-canvas .canvas-tag-badge.show { display: block !important; }

  .rpg-card-canvas .canvas-skills-row {
    display: flex !important;
    gap: 16px !important;
    justify-content: center !important;
    align-items: center !important;
  }

  .rpg-card-canvas .canvas-skill-slot {
    width: 90px !important;
    height: 84px !important;
    min-width: 90px !important;
    min-height: 84px !important;
    background-image: url('card/skills.png') !important;
    background-size: 100% 100% !important;
    background-repeat: no-repeat !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    overflow: hidden !important;
  }
  .rpg-card-canvas .canvas-skill-slot.editable { cursor: pointer !important; }

  .rpg-card-canvas .canvas-skill-slot img {
    width: 76% !important;
    height: 76% !important;
    max-width: 68px !important;
    max-height: 64px !important;
    object-fit: contain !important;
    display: block !important;
  }

  .rpg-card-canvas .canvas-right {
    display: flex !important;
    flex-direction: column !important;
    gap: 10px !important;
    padding-top: 6px !important;
  }

  .rpg-card-canvas .rpg-label {
    font-family: 'Pixel Arial 11', monospace !important;
    font-size: 18px !important;
    font-weight: normal !important;
    color: #726350 !important;
    margin-right: 8px !important;
    white-space: nowrap !important;
    user-select: none !important;
  }

  .rpg-card-canvas .rpg-val-text,
  .rpg-card-canvas input.rpg-input-val {
    font-family: 'Pixel Arial 11', monospace !important;
    font-size: 22px !important;
    color: #2b2216 !important;
    flex: 1 !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    white-space: nowrap !important;
  }

  .rpg-card-canvas .canvas-area-large {
    width: 480px !important;
    height: 56px !important;
    background-image: url('card/large_area.png') !important;
    background-size: 100% 100% !important;
    background-repeat: no-repeat !important;
    display: flex !important;
    align-items: center !important;
    padding: 0 22px !important;
  }

  .rpg-card-canvas .canvas-area-medium {
    width: 314px !important;
    max-width: 100% !important;
    height: 52px !important;
    background-image: url('card/medium_area.png') !important;
    background-size: 100% 100% !important;
    background-repeat: no-repeat !important;
    display: flex !important;
    align-items: center !important;
    padding: 0 20px !important;
  }

  .rpg-card-canvas .canvas-row-small {
    display: flex !important;
    gap: 10px !important;
    width: 480px !important;
  }

  .rpg-card-canvas .canvas-area-small {
    width: 235px !important;
    height: 52px !important;
    background-image: url('card/small_area.png') !important;
    background-size: 100% 100% !important;
    background-repeat: no-repeat !important;
    display: flex !important;
    align-items: center !important;
    padding: 0 18px !important;
  }

  .rpg-card-canvas .canvas-area-bio {
    width: 480px !important;
    height: 220px !important;
    background-image: url('card/biografy.png') !important;
    background-size: 100% 100% !important;
    background-repeat: no-repeat !important;
    display: flex !important;
    flex-direction: column !important;
    padding: 16px 22px !important;
  }

  .rpg-card-canvas .rpg-bio-text,
  .rpg-card-canvas textarea.rpg-bio-input {
    font-family: 'Pixel Arial 11', monospace !important;
    font-size: 17px !important;
    color: #2b2216 !important;
    flex: 1 !important;
    line-height: 1.4 !important;
    word-break: break-word !important;
    white-space: pre-wrap !important;
    overflow-y: auto !important;
    margin-top: 6px !important;
  }

  /* ============ BOTONES Y EDICIÓN AUXILIAR ============ */
  .btn-outer { width: 956px !important; max-width: 100% !important; margin: 16px auto 0 auto !important; }
  .edit-aux-controls { width: 956px !important; max-width: 100% !important; margin: 14px auto 0 auto !important; }
  .card-btn-row {
    display: flex !important;
    gap: 20px !important;
    justify-content: center !important;
    align-items: center !important;
    padding: 12px 0 !important;
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    border-radius: 0 !important;
  }
  .rpg-img-btn {
    background: transparent !important;
    border: none !important;
    outline: none !important;
    padding: 0 !important;
    margin: 0 !important;
    cursor: pointer !important;
    box-shadow: none !important;
    transition: transform 0.15s ease, filter 0.15s ease !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
  }
  .rpg-img-btn:hover {
    transform: scale(1.06) !important;
    filter: brightness(1.15) !important;
  }
  .rpg-img-btn:active {
    transform: scale(0.96) !important;
  }
  .rpg-img-btn img {
    display: block !important;
    height: 52px !important;
    width: auto !important;
    object-fit: contain !important;
    border: none !important;
    outline: none !important;
  }

  .hidden{display:none !important;}

  /* ============ DROPDOWN PANELS (Skills / Tags) ============ */
  .dropdown-panel{
    position:absolute;
    z-index:200;
    background:var(--card-bg);
    border:2px solid var(--card-border);
    padding:12px;
    box-shadow:0 6px 16px rgba(0,0,0,0.3);
    display:none;
    max-height:220px;
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:var(--text-muted) transparent;
  }
  .dropdown-panel.open{display:block;}
  .dropdown-panel::-webkit-scrollbar{width:14px;}
  .dropdown-panel::-webkit-scrollbar-track{background:transparent;}
  .dropdown-panel::-webkit-scrollbar-thumb{
    background-image:url('assets/scroll.png');
    background-size:100% 100%;background-repeat:no-repeat;
  }

  .card-role-badge {
    position: absolute !important;
    top: 14px !important;
    right: 18px !important;
    background: linear-gradient(180deg, #8b0000, #4a0000) !important;
    color: #fff !important;
    border: 1.5px solid #d4af37 !important;
    font-family: 'Pixel Arial 11', monospace !important;
    font-size: 11px !important;
    font-weight: bold !important;
    padding: 4px 10px !important;
    border-radius: 4px !important;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5) !important;
    letter-spacing: 1px !important;
    z-index: 10 !important;
  }

  /* Grid de skills (4 columnas) */
  .skills-dropdown{
    width:300px;
    grid-template-columns:repeat(4, 1fr);
    gap:8px;
  }
  .skills-dropdown.open{display:grid;}
  .skill-option{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    background:none;border:none;padding:4px;cursor:pointer;font-family:inherit;
  }
  .skill-option img{
    width:48px;height:48px;object-fit:cover;border:1px solid var(--field-border);
  }
  .skill-option span{font-size:8px;color:var(--text-dark);text-align:center;line-height:1.1;}
  .skill-option.selected img{opacity:0.5;}

  /* Lista de tags (1 columna) */
  .tags-dropdown{
    width:220px;
  }
  .tags-dropdown .tag-option{
    display:block;width:100%;background:none;border:none;padding:2px 0;
    cursor:pointer;margin-bottom:4px;
  }
  .tags-dropdown .tag-option img{width:100%;display:block;}
  .tags-dropdown .tag-option.selected img{opacity:0.5;}

  /* ============ SELECTORES AUXILIARES (Tag & Clan) ============ */
  .btn-select-tag {
    font-family: 'Pixel Arial 11', monospace !important;
    font-size: 13px !important;
    color: #2b2216 !important;
    background-image: url('card/medium_area.png') !important;
    background-size: 100% 100% !important;
    background-repeat: no-repeat !important;
    background-color: transparent !important;
    border: none !important;
    outline: none !important;
    height: 44px !important;
    width: 100% !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    cursor: pointer !important;
    padding: 0 16px !important;
    box-shadow: none !important;
  }
  .btn-select-tag:hover:not(:disabled) { filter: brightness(1.1) !important; }
  .btn-select-tag:disabled { opacity: 0.5 !important; cursor: not-allowed !important; }

  .clan-display {
    font-family: 'Pixel Arial 11', monospace !important;
    font-size: 13px !important;
    color: #2b2216 !important;
    background-image: url('card/medium_area.png') !important;
    background-size: 100% 100% !important;
    background-repeat: no-repeat !important;
    background-color: transparent !important;
    border: none !important;
    outline: none !important;
    height: 44px !important;
    width: 100% !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    cursor: pointer !important;
    padding: 0 16px !important;
    box-shadow: none !important;
  }
  .clan-display:hover { filter: brightness(1.1) !important; }

  .tags-dropdown, .clan-dropdown {
    position: absolute !important;
    top: 100% !important;
    left: 0 !important;
    margin-top: 6px !important;
    background: #f5f0e6 !important;
    border: 2px double #a3967d !important;
    border-radius: 6px !important;
    padding: 10px !important;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3) !important;
    z-index: 500 !important;
  }

  /* ============ STATUS ============ */
  .status-msg{
    margin-top:12px;text-align:center;font-size:13px;
    min-height:20px;color:var(--text-muted);
  }
  .status-msg.ok{color:#2f5a2f;}
  .status-msg.err{color:#8a1f1f;}

  .spinner{
    display:inline-block;width:14px;height:14px;
    border:2px solid var(--text-muted);
    border-top-color:var(--text-dark);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    vertical-align:middle;margin-right:6px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes spinPulse{
    0%{transform:rotate(0deg) scale(1);opacity:0.7;}
    50%{transform:rotate(180deg) scale(1.15);opacity:1;}
    100%{transform:rotate(360deg) scale(1);opacity:0.7;}
  }
  @keyframes fadeSlideUp{
    from{opacity:0;transform:translateY(18px);}
    to{opacity:1;transform:translateY(0);}
  }
  .fade-in{animation:fadeSlideUp 0.45s ease-out both;}
  .fade-in-fast{animation:fadeSlideUp 0.3s ease-out both;}
  .page-transition{
    position:fixed;inset:0;background:var(--page-bg);
    display:flex;align-items:center;justify-content:center;z-index:9999;
    opacity:1;transition:opacity 0.35s ease;
  }
  .page-transition.hidden{display:none !important;opacity:0;pointer-events:none;}
  .page-transition .pt-spinner{
    width:48px;height:48px;
    border:4px solid rgba(169,155,120,0.25);
    border-top-color:var(--card-border);
    border-right-color:var(--text-muted);
    border-radius:50%;
    animation:spinPulse 1s ease-in-out infinite;
    box-shadow:0 0 18px rgba(169,155,120,0.25);
  }

  /* ============ OVERLAY DE CARGA ============ */
  .loading-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.55);
    display:none;
    align-items:center;justify-content:center;
    flex-direction:column;gap:16px;
    z-index:900;
  }
  .loading-overlay.open{display:flex;}
  .loading-overlay .big-spinner{
    width:56px;height:56px;
    border:4px solid rgba(255,255,255,0.15);
    border-top-color:#c2b59b;
    border-right-color:rgba(255,255,255,0.4);
    border-radius:50%;
    animation:spinPulse 1s ease-in-out infinite;
    box-shadow:0 0 24px rgba(0,0,0,0.3), 0 0 20px rgba(194,181,155,0.2);
  }
  .loading-overlay .loading-text{
    color:#fff;font-size:14px;letter-spacing:0.5px;
  }

  /* ============ MODAL DE CONFIRMACIÓN ============ */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.5);
    display:none;align-items:center;justify-content:center;
    z-index:500;padding:20px;
  }
  .overlay.open{display:flex;}
  .overlay-box{
    background:var(--card-bg);
    border:3px solid var(--card-border);
    border-radius:6px;
    padding:28px 32px;
    max-width:380px;width:100%;
    text-align:center;
  }
  .overlay-message{
    font-size:15px;line-height:1.5;color:var(--text-dark);margin-bottom:20px;
  }
  .overlay-actions{display:flex;justify-content:center;gap:40px;}
  .overlay-link{
    font-family:inherit;font-size:18px;cursor:pointer;
    background:none;border:none;padding:0;
    text-decoration:underline;text-decoration-style:dotted;
  }
  .overlay-link.yes{color:#1a4fb5;}
  .overlay-link.no{color:var(--admin-color);}

  /* ============ BADGE DE ESTADO (aprobación) ============ */
  .status-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:5px 12px;
    border-radius:999px;
    font-size:13px;
    font-weight:bold;
    margin-bottom:12px;
  }
  .status-badge.pendiente{background:#f6e7b8;color:#8a6d1a;border:1px solid #d9c06a;}
  .status-badge.aprobado{background:#d8f0d6;color:#2c6e2c;border:1px solid #9bd19b;}
  .status-badge.rechazado{background:#f6d8d8;color:#9a2c2c;border:1px solid #d99b9b;}
  .status-badge .dot{width:9px;height:9px;border-radius:50%;background:currentColor;}

  /* ============ ÁREA DE ENVÍO A REVISIÓN ============ */
  .submit-register{
    display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:18px;
  }
  .submit-register .cooldown-msg{font-size:12px;color:var(--text-muted);text-align:center;}
  .btn-send-register{
    padding:10px 22px;
    background:var(--card-border,#a99b78);
    color:#fff;border:none;border-radius:10px;
    font-family:inherit;font-size:15px;font-weight:bold;cursor:pointer;
  }
  .btn-send-register:disabled{filter:grayscale(0.6);cursor:not-allowed;opacity:0.7;}

  html, body {
    max-width: 100vw !important;
    overflow-x: hidden !important;
  }

  /* ============ RESPONSIVE ============ */
  @media(max-width:980px){
    .hotbar{padding:12px 14px;}
    .hotbar-nav{flex-wrap:wrap !important;justify-content:center !important;gap:6px 12px !important;font-size:13px !important;}
    .btn-outer, .edit-aux-controls {
      width: 100% !important;
      max-width: 100vw !important;
      margin: 12px auto 0 auto !important;
      padding: 0 10px !important;
      box-sizing: border-box !important;
    }
    .card-btn-row {
      flex-wrap: wrap !important;
      gap: 8px 12px !important;

function scaleProfileCard(){
  const wrappers = document.querySelectorAll('.rpg-canvas-wrapper');
  const screenWidth = window.innerWidth;
  wrappers.forEach(wrapper => {
    const scaler = wrapper.querySelector('.rpg-canvas-scaler');
    if(!scaler) return;
    const parentWidth = wrapper.parentElement ? wrapper.parentElement.clientWidth : screenWidth;
    const availableWidth = Math.min(screenWidth, parentWidth || screenWidth);
    
    if(availableWidth < 980){
      const pad = 16;
      const targetWidth = Math.min(availableWidth - pad, 956);
      const scale = targetWidth / 956;
      
      scaler.style.position = 'absolute';
      scaler.style.left = '0';
      scaler.style.top = '0';
      scaler.style.transform = `scale(${scale})`;
      scaler.style.transformOrigin = '0 0';
      
      wrapper.style.position = 'relative';
      wrapper.style.width = `${targetWidth}px`;
      wrapper.style.height = `${579 * scale}px`;
      wrapper.style.margin = '0 auto';
      wrapper.style.overflow = 'hidden';
    } else {
      scaler.style.position = 'relative';
      scaler.style.left = '';
      scaler.style.top = '';
      scaler.style.transform = '';
      scaler.style.transformOrigin = '';
      
      wrapper.style.position = 'relative';
      wrapper.style.width = '956px';
      wrapper.style.height = '579px';
      wrapper.style.margin = '0 auto';
      wrapper.style.overflow = 'visible';
    }
  });
}

async function loadProfile(){
  try{
    // Cargar perfil
    const { data: prof, error: ep } = await db
      .from('profiles').select('*').eq('id', currentUser.id).single();
    if(ep && ep.code !== 'PGRST116') throw ep;
    currentProfile = prof;

    // ¿Es admin? Usamos la RPC que ya está en la BD.
    try{
      const { data: isAdm } = await db.rpc('is_admin');
      isAdmin = !!isAdm;
    } catch(_){
      // Fallback: mirar el rol del perfil
      isAdmin = currentProfile?.role === 'admin';
    }

    // Cargar personaje del usuario
    const { data: chars, error: ec } = await db
      .from('characters').select('*').eq('owner_id', currentUser.id);
    if(ec) throw ec;

    if(chars && chars.length){
      currentCharacter = chars[0];
      currentStatus = currentCharacter.status || 'pendiente';
      lastSubmit   = currentCharacter.last_submit || null;
    } else {
      // Usuario nuevo sin personaje registrado aún
      currentCharacter = { owner_id: currentUser.id };
      currentStatus = 'nuevo';
      lastSubmit = null;
    }

    renderHeader();
    renderProfile();
    renderStatusBadge();

    // Si es usuario nuevo o fue rechazado, habilitar el modo edición de inmediato
    if(currentStatus === 'nuevo' || currentStatus === 'rechazado'){
      enterEditMode();
    }

    console.error('[loadProfile]', err);

}

const STATUS_LABELS = {

  pendiente: '🟡 Pendiente de aprobación',
  aprobado:  '✅ Aprobado',
  rechazado: '🔴 Rechazado',
};

function renderStatusBadge(){
  const badge = $('status-badge');
  const txt   = $('status-text');
  const wrap  = $('submit-register');
  const cd    = $('cooldown-msg');
  if(!badge) return;

  badge.className = 'status-badge ' + currentStatus;
  badge.style.display = 'inline-flex';
  let label = STATUS_LABELS[currentStatus] || 'Pendiente';
  if(currentStatus === 'rechazado' && currentCharacter?.reject_reason){
    label += ': ' + currentCharacter.reject_reason;
  }
  txt.textContent = label;

  // El área de abajo solo se usa para avisar del cooldown (usuario normal).
  if(wrap && cd){
    const canSend = canResubmit();
    if(isAdmin || canSend){
      wrap.style.display = 'none';
    } else {
      wrap.style.display = 'flex';
      cd.textContent = 'Debes esperar ' + daysLeftCooldown() + ' día(s) para volver a enviar tu registro.';
    }
  }
}

// ¿Han pasado 3 días desde el último envío?
function canResubmit(){
  if(currentStatus === 'nuevo' || !currentCharacter || !currentCharacter.id) return true;
  if(currentStatus === 'pendiente') return false;
  if(currentStatus === 'rechazado') return true;
  if(!lastSubmit) return true;
  const diffMs = Date.now() - new Date(lastSubmit).getTime();
  return diffMs >= 3 * 24 * 60 * 60 * 1000;
}

function daysLeftCooldown(){
  if(!lastSubmit) return 0;
  const elapsed = Date.now() - new Date(lastSubmit).getTime();
  const left = Math.ceil((3 * 24 * 60 * 60 * 1000 - elapsed) / (24 * 60 * 60 * 1000));
  return Math.max(0, left);
}

function setTodayDate(){
  const d = new Date();
  const fmt = String(d.getDate()).padStart(2,'0')+'/'+
              String(d.getMonth()+1).padStart(2,'0')+'/'+
              String(d.getFullYear()).slice(-2);
  $('fecha-display').textContent = fmt;
}

/* ============================================================
   MODO EDICIÓN
   ============================================================ */
function enterEditMode(){
  isEditing = true;

  // Guardar estado original (para cancelar)
  originalData = {
    name: $('f-name').value,
    age: $('f-age').value,
    rank: $('f-rank').value,
    zodiac: $('f-zodiac').value,
    clan: $('f-clan').value,
    bio: $('f-bio').value,
    skills: [...(currentCharacter?.skills || [])],
    photo: currentCharacter?.portrait_info || null,
    tag: selectedTag
  };

  // Habilitar inputs: los usuarios normales editan nombre, edad, bio.
  // Rango y Clase solo son editables por el Moderador/Admin.
  const idsToEnable = ['f-name', 'f-age', 'f-bio'];
  if (isAdmin) {
    idsToEnable.push('f-rank', 'f-zodiac');
  }

  idsToEnable.forEach(id=>{
    const el = $(id);
    el.removeAttribute('readonly');
    el.disabled = false;
    const box = el.closest('.field-value, .bio-box');
    if(box) box.classList.remove('readonly');
  });

  // Skills editables para todos
  [1,2].forEach(n=>{
    $('skill-slot-'+n).classList.add('editable');
  });

  // Tag editable para todos
  $('btn-select-tag').disabled = false;

  // Foto clickable para todos
  $('photo-box').classList.add('editable');

  // Clan: menú con iconos editable por cualquiera al editar.
  $('clan-display').classList.add('editable');
  updateClanIcon();

  // Cambiar botones
  $('btn-row-view').classList.add('hidden');
  $('btn-row-edit').classList.remove('hidden');
  $('edit-aux-controls').classList.remove('hidden');

  showStatus('Editando… hace tus cambios y dale a "Guardar"', '');
}

function exitEditMode(save=false){
  isEditing = false;
  $('edit-aux-controls').classList.add('hidden');

  // Deshabilitar inputs
  ['f-name','f-age','f-rank','f-bio'].forEach(id=>{
    const el = $(id);
    el.setAttribute('readonly','');
    const box = el.closest('.field-value, .bio-box');
    if(box) box.classList.add('readonly');
  });
  $('f-zodiac').disabled = true;

  // Cerrar el menú de clanes y quitar el modo editable
  $('clan-display').classList.remove('editable');
  $('clan-dropdown').classList.remove('open');

  [1,2].forEach(n=>{
    $('skill-slot-'+n).classList.remove('editable');
  });
  $('btn-select-tag').disabled = true;
  $('photo-box').classList.remove('editable');
  closeAllPanels();

  // Restaurar si canceló
  if(!save && originalData){
    $('f-name').value = originalData.name;
    $('f-age').value = originalData.age;
    $('f-rank').value = originalData.rank;
    $('f-zodiac').value = originalData.zodiac;
    $('f-clan').value = originalData.clan;
    $('f-bio').value = originalData.bio;
    selectedTag = originalData.tag;
    if(currentCharacter){
      currentCharacter.skills = originalData.skills;
      currentCharacter.portrait_info = originalData.photo;
    }
    renderProfile();
  }

  $('btn-row-edit').classList.add('hidden');
  $('btn-row-view').classList.remove('hidden');
  updateClanIcon();
  showStatus('', '');
}

/* ============================================================
   VALIDACIÓN DE FORMULARIO
   ============================================================ */
function validateProfileForm(updates){
  // 1. Nombre (Obligatorio)
  if(!updates.name || updates.name.trim() === ''){
    showStatus('⚠️ Debes ingresar el Nombre de tu personaje.', 'err');
    return false;
  }

  // 2. Edad (Obligatoria, solo números)
  if(updates.age === null || updates.age === undefined || isNaN(updates.age)){
    showStatus('⚠️ La Edad es obligatoria y solo debe contener números (ej. 20).', 'err');
    return false;
  }

  // 3. Clan (Obligatorio)
  if(!updates.clan || updates.clan.trim() === ''){
    showStatus('⚠️ Debes elegir un Clan para tu personaje.', 'err');
    return false;
  }

  // 4. Tag (Obligatorio)
  if(!selectedTag){
    showStatus('⚠️ Debes elegir un Tag para tu personaje.', 'err');
    return false;
  }

  // 5. Habilidades / Skills (Obligatorio seleccionar al menos 1)
  if(!updates.skills || updates.skills.length === 0){
    showStatus('⚠️ Debes seleccionar al menos 1 Habilidad / Skill para tu personaje.', 'err');
    return false;
  }

  // 6. Foto de Perfil (Obligatoria)
  if(!currentCharacter?.portrait_info){
    showStatus('⚠️ Debes seleccionar una Foto de Perfil para tu personaje.', 'err');
    return false;
  }

  // Biografía es opcional. Clase y Rango son gestionados exclusivamente por los Moderadores.
  return true;
}

/* ============================================================
   ENVIAR REGISTRO A REVISIÓN (sistema de aprobación)
   ============================================================ */
async function sendToReview(){
  if(!currentCharacter){
    currentCharacter = { owner_id: currentUser.id };
  }
  if(!canResubmit()){
    showStatus('Debes esperar ' + daysLeftCooldown() + ' día(s) para volver a enviar.', 'err');
    renderStatusBadge();
    return;
  }

  // Recolectar datos actuales del formulario y validar.
  const updates = collectProfileUpdates();
  if(!validateProfileForm(updates)){
    return;
  }

  showStatus('<span class="spinner"></span>Enviando a revisión…', '');
  $('loading-overlay').classList.add('open');

  const now = new Date().toISOString();
  const changes = {
    ...updates,
    status: 'pendiente',
    last_submit: now,
    reviewed_by: null,
    reviewed_at: null,
    reject_reason: null,
  };

  let error;
  if(currentCharacter.id){
    const r = await db.from('characters').update(changes).eq('id', currentCharacter.id);
    error = r.error;
  } else {
    const r = await db.from('characters').insert({
      ...changes,
      owner_id: currentUser.id,
      category: 'Kages',
      name: changes.name || 'Sin nombre',
    }).select('id').single();
    error = r.error;
    if(!error && r.data) currentCharacter.id = r.data.id;
  }

  $('loading-overlay').classList.remove('open');
  if(error){
    showStatus('Error al enviar: ' + error.message, 'err');
    return;
  }

  currentCharacter = { ...currentCharacter, ...changes };
  currentStatus = 'pendiente';
  lastSubmit = now;
  notifyDiscord(updates, false, 'pendiente');
}

// Recoge los campos editables del formulario (igual que saveProfile).
function collectProfileUpdates(){
  let currentSkills = (currentCharacter?.skills || []).filter(Boolean);
  if(currentSkills.length === 0){
    [1,2].forEach(n=>{
      const img = document.querySelector('#skill-slot-'+n+' img.skill-img');
      if(img && img.src && img.src !== '') currentSkills.push(img.src);
    });
  }
  return {
    bio: $('f-bio').value.trim(),
    skills: currentSkills,
    modes: selectedTag ? [selectedTag] : [],
    portrait_info: currentCharacter?.portrait_info || null,
    portrait_list: currentCharacter?.portrait_info || null,
    is_wiki: false,
    name: $('f-name').value.trim(),
    age:    (()=>{ const v=$('f-age').value.trim(); return v==='' ? null : parseInt(v,10); })(),
    rank:   $('f-rank').value.trim() || 'Genin',
    zodiac: $('f-zodiac').value.trim() || 'Miembro',
    clan:   $('f-clan').value || null,
  };
}

/* ============================================================
   GUARDAR
   ============================================================ */
async function saveProfile(){
  if(!currentCharacter){
    showStatus('No hay personaje vinculado a tu cuenta.', 'err');
    return;
  }

  // Usuario normal: respetar reglas de envío (pendiente = bloqueado,
  // aprobado = cooldown 3 días, rechazado = libre).
  if(!isAdmin){
    if(currentStatus === 'pendiente'){
      showStatus('Ya enviaste tu registro y está en revisión. Espera a que un moderador lo apruebe o rechace.', 'err');
      return;
    }
    if(currentStatus === 'aprobado' && !canResubmit()){
      showStatus('Debes esperar ' + daysLeftCooldown() + ' día(s) para volver a enviar tu registro.', 'err');
      return;
    }
  }

  const updates = collectProfileUpdates();
  if(!validateProfileForm(updates)){
    return;
  }

  // El mod/admin guarda libre; el usuario normal manda a revisión (pendiente).
  if(!isAdmin){
    updates.status = 'pendiente';
    updates.last_submit = new Date().toISOString();
    updates.reviewed_by = null;
    updates.reviewed_at = null;
    updates.reject_reason = null;
  }

  showStatus('<span class="spinner"></span>Guardando…', '');
  $('loading-overlay').classList.add('open');
  let error, data;
  const esNuevo = !currentCharacter.id;

  if(currentCharacter.id){
    // Actualizar personaje existente
    const r = await db.from('characters')
      .update(updates).eq('id', currentCharacter.id);
    error = r.error;
  } else {
    // Crear personaje nuevo
    const insertData = {
      ...updates,
      owner_id: currentUser.id,
      category: 'Kages',
      name: updates.name || 'Sin nombre',
      status: 'pendiente',
      last_submit: new Date().toISOString(),
    };
    const r = await db.from('characters')
      .insert(insertData).select('id').single();
    error = r.error;
    data = r.data;
    if(!error && data){
      currentCharacter.id = data.id;
      currentStatus = 'pendiente';
      lastSubmit = insertData.last_submit;
    }
  }

  $('loading-overlay').classList.remove('open');

  if(error){
    showStatus('Error al guardar: ' + error.message, 'err');
    return;
  }
  currentCharacter = { ...currentCharacter, ...updates };
  if(!isAdmin){
    currentStatus = 'pendiente';
    lastSubmit = updates.last_submit;
  }
  renderStatusBadge();

  if(isAdmin){
    showStatus('¡Cambios guardados!', 'ok');
    exitEditMode(true);
    notifyDiscord(updates, esNuevo);
  } else {
    showStatus('¡Registro enviado a revisión! Un moderador lo revisará pronto.', 'ok');
    exitEditMode(true);
    notifyDiscord(updates, esNuevo, 'pendiente');
  }
}

/* ============================================================
   AVISO A DISCORD (webhook) — cada vez que se guarda el perfil
   ============================================================ */
function dataURLtoBlob(dataURL){
  const parts = dataURL.split(',');
  const mimeMatch = parts[0].match(/data:([^;]+)/);
  const mime = mimeMatch ? mimeMatch[1] : 'image/png';
  const binary = atob(parts[1]);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for(let i=0;i<len;i++){ bytes[i] = binary.charCodeAt(i); }
  return new Blob([bytes], { type: mime });
}

async function notifyDiscord(updates, esNuevo, estado){  // estado: pendiente|aprobado|rechazado|undefined
  try{
    const name  = (updates.name || 'Sin nombre');
    const foto  = updates.portrait_info || null;
    const autor = currentProfile?.username || currentUser?.email || 'Usuario';

    let prefijo = esNuevo ? 'Nuevo Perfil' : 'Perfil Actualizado';
    if(estado === 'pendiente') prefijo = '🟡 Registro Pendiente';
    else if(estado === 'aprobado') prefijo = '✅ Registro Aprobado';
    else if(estado === 'rechazado') prefijo = '🔴 Registro Rechazado';

    const titulo = prefijo;
    const mensaje = `**${titulo}:** ${name}\nPor: ${autor}`;

    // Capturar la ficha completa como imagen (como el Registro Civil de antes).
    let blob = null;
    try{
      const card = $('profile-card');
      if(card && typeof html2canvas === 'function'){
        const canvas = await html2canvas(card, {
          backgroundColor: '#f6f2e6',
          scale: 3,
          useCORS: true,
          logging: false,
          width: 620,
          windowWidth: 900,
          onclone: (doc)=>{
            const c = doc.getElementById('profile-card');
            if(c){
              // Ficha compacta (más cuadrada) => el preview de Discord muestra
              // el contenido más grande y legible sin abrir la imagen.
              c.style.width = '620px';
              c.style.maxWidth = '620px';
              c.style.gridTemplateColumns = '1fr 1fr';
              c.style.gap = '14px';
              c.style.padding = '16px';
            }
            // Evitar que html2canvas estire la imagen del clan: forzar proporción.
            const ci = doc.getElementById('clan-icon');
            if(ci){
              ci.style.width = 'auto';
              ci.style.maxWidth = '100%';
              ci.style.height = '56px';
              ci.style.objectFit = 'contain';
              ci.style.margin = '0 auto';
              ci.style.display = 'block';
            }
            const cd = doc.getElementById('clan-display');
            if(cd){
              cd.style.display = 'flex';
              cd.style.justifyContent = 'center';
              cd.style.alignItems = 'center';
            }
            // Agrandar el texto de la ficha para mejor lectura en el preview.
            if(c){
              c.querySelectorAll('label').forEach(el=>{ el.style.fontSize = '14px'; });
              c.querySelectorAll('input, textarea, .field-value, .field-value input, .field-value textarea')
                .forEach(el=>{ el.style.fontSize = '16px'; });
            }
          },
        });
        blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
      }
    }catch(e){ console.error('[notifyDiscord] captura ficha', e); blob = null; }

    // Fallback: si no se pudo capturar la ficha, mandar solo la foto.
    if(!blob && foto){
      try{
        blob = foto.startsWith('data:') ? dataURLtoBlob(foto) : await (await fetch(foto)).blob();
      }catch(e){ console.error('[notifyDiscord] foto->blob', e); blob = null; }
    }
    console.log('[notifyDiscord] blob:', blob && blob.size);

    if(blob){
      const fileName = 'perfil_' + name.replace(/[^a-zA-Z0-9_-]/g,'_') + '.png';
      // Imagen como archivo directo => Discord la muestra en grande (sin embed).
      const formData = new FormData();
      formData.append('payload_json', JSON.stringify({ content: mensaje }));
      formData.append('files[0]', blob, fileName);
      await fetch(WEBHOOK_URL, { method: 'POST', body: formData });
    } else {
      await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: mensaje }),
      });
    }
  }catch(err){
    // El aviso a Discord no debe romper el guardado.
    console.error('[notifyDiscord]', err);
  }
}

/* ============================================================
   SKILLS DROPDOWN
   ============================================================ */
function buildSkillsDropdown(){
  const panel = $('skills-dropdown');
  SKILL_OPTIONS.forEach(opt=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'skill-option';
    btn.innerHTML =
      `<img src="${opt.image}" alt="${opt.name}" />` +
      `<span>${opt.name}</span>`;
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      selectSkill(currentSkillSlot, opt.image);
      closeAllPanels();
    });
    panel.appendChild(btn);
  });
}

function selectSkill(slotNum, imagePath){
  if(!currentCharacter) currentCharacter = {};
  if(!currentCharacter.skills) currentCharacter.skills = [];
  currentCharacter.skills[slotNum-1] = imagePath;
  // re-render solo skills
  const skills = currentCharacter.skills;
  [1,2].forEach(n=>{
    const slot = $('skill-slot-'+n);
    const img = slot.querySelector('img.skill-img');
    if(skills[n-1]){
      img.src = skills[n-1];
      slot.classList.add('has-img');
    } else {
      slot.classList.remove('has-img');
      img.removeAttribute('src');
    }
  });
}

/* ============================================================
   TAGS DROPDOWN
   ============================================================ */
function buildTagsDropdown(){
  const panel = $('tags-dropdown');
  TAG_OPTIONS.forEach(opt=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tag-option';
    const img = document.createElement('img');
    img.src = opt.image; img.alt = opt.name;
    img.onerror = ()=>{ img.style.background='#ccc'; img.style.height='30px'; };
    btn.appendChild(img);
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(selectedTag === opt.image){
        selectedTag = null;
      } else {
        selectedTag = opt.image;
      }
      renderTagBadge();
      closeAllPanels();
    });
    panel.appendChild(btn);
  });
}

function renderTagBadge(){
  const badge = $('tag-badge');
  if(selectedTag){
    badge.src = selectedTag;
    badge.classList.add('show');
    badge.onerror = ()=>{ badge.classList.remove('show'); };
  } else {
    badge.classList.remove('show');
    badge.removeAttribute('src');
  }
}

/* ============================================================
   FOTO
   ============================================================ */
$('photo-box').addEventListener('click', ()=>{
  if(!isEditing) return;
  // crea un input file temporal y ábrelo
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 2*1024*1024){
      showStatus('La imagen pesa más de 2MB.', 'err');
      return;
    }
    const reader = new FileReader();
    reader.onload = ev=>{
      const src = ev.target.result;
      $('photo-img').src = src;
      $('photo-box').classList.add('has-img');
      if(currentCharacter) currentCharacter.portrait_info = src;
    };
    reader.readAsDataURL(file);
  };
  input.click();
});

   LISTENERS
   ============================================================ */
const CLAN_OPTIONS = [
  { name: 'Mizu',    image: 'Clan/mizu.png' },
  { name: 'Rain',    image: 'Clan/rain.png' },
  { name: 'Equinox', image: 'Clan/equinox.png' },
  { name: 'Asakura', image: 'Clan/asakura.png' },
];
const CLAN_IMAGES = Object.fromEntries(CLAN_OPTIONS.map(c => [c.name, c.image]));

function buildClanDropdown(){
  const panel = $('clan-dropdown');
  if(!panel) return;
  panel.innerHTML = '';
  // Opción "sin clan"
  const none = document.createElement('button');
  none.type = 'button';
  none.className = 'clan-option';
  none.dataset.value = '';
  none.innerHTML = '<span>— Sin clan —</span>';
  none.addEventListener('click', (e)=>{ e.stopPropagation(); selectClan(''); });
  panel.appendChild(none);

  CLAN_OPTIONS.forEach(opt=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'clan-option';
    btn.dataset.value = opt.name;
    btn.innerHTML = `<img src="${opt.image}" alt="${opt.name}" /><span>${opt.name}</span>`;
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); selectClan(opt.name); });
    panel.appendChild(btn);
  });
}

function selectClan(value){
  $('f-clan').value = value;
  updateClanIcon();
  $('clan-dropdown').classList.remove('open');
}

function updateClanIcon(){
  const icon = $('clan-icon');
  const topBadge = $('clan-top-badge');
  const topIcon = $('clan-top-icon');
  const box = $('clan-display');
  const ph  = $('clan-placeholder');
  if(!icon || !box) return;
  const val = $('f-clan').value;
  const src = CLAN_IMAGES[val];
  // marcar la opción activa en el panel
  $('clan-dropdown').querySelectorAll('.clan-option').forEach(o=>{
    o.classList.toggle('selected', o.dataset.value === val);
  });
  if(src){
    icon.src = src;
    icon.alt = val;
    icon.style.display = 'block';
    if(topIcon && topBadge){
      topIcon.src = src;
      topIcon.alt = val;
      topBadge.style.display = 'flex';
    }
    if(ph) ph.style.display = 'none';
    box.classList.add('has-clan');
  } else {
    icon.removeAttribute('src');
    icon.style.display = 'none';
    if(topIcon && topBadge){
      topIcon.removeAttribute('src');
      topBadge.style.display = 'none';
    }
    if(ph) ph.style.display = 'block';
    box.classList.remove('has-clan');
  }
}

function setupListeners(){
  $('btn-edit').addEventListener('click', enterEditMode);
  $('btn-cancel').addEventListener('click', ()=>exitEditMode(false));
  $('btn-submit').addEventListener('click', saveProfile);
  $('btn-logout').addEventListener('click', logout);
  $('btn-delete').addEventListener('click', askDelete);

  buildClanDropdown();
  // Abrir/cerrar el menú de clanes (al editar, cualquiera puede elegir)
  $('clan-display').addEventListener('click', (e)=>{
    if(!isEditing) return;
    e.stopPropagation();
    $('clan-dropdown').classList.toggle('open');
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.clan-wrap')) $('clan-dropdown').classList.remove('open');
  });

  $('btn-select-tag').addEventListener('click', (e)=>{
    e.stopPropagation();
    $('tags-dropdown').classList.toggle('open');
  });

  // Skills clickeables
  [1,2].forEach(n=>{
    $('skill-slot-'+n).addEventListener('click', (e)=>{
      if(!isEditing) return;
      e.stopPropagation();
      closeAllPanels();
      currentSkillSlot = n;
      $('skills-dropdown').classList.add('open');
    });
  });
}

<!-- Overlay de carga al guardar -->
<div class="loading-overlay" id="loading-overlay">
  <div class="big-spinner"></div>
  <div class="loading-text">Guardando…</div>
</div>

<script>
document.querySelectorAll('.nav-link').forEach(a => {
  a.addEventListener('click', function(e){
    if(this.hostname === location.hostname){
      e.preventDefault();
      document.getElementById('page-transition').classList.remove('hidden');
      setTimeout(() => { location.href = this.href; }, 350);
    }
  });
});
function hideTransition(){
  const pt = document.getElementById('page-transition');
  if(pt) pt.classList.add('hidden');
}
if(document.readyState === 'complete'){
  hideTransition();
} else {
  window.addEventListener('load', hideTransition);
}
window.addEventListener('pageshow', hideTransition);
setTimeout(hideTransition, 1500);
</script>

</body>
</html>
